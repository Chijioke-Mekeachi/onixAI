<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="/api/v1/ai/assets/style.css">
</head>
<body>
  <div class="mac-desktop">
    <main class="mac-window" id="mac-window">
      <!-- macOS Window Header / Titlebar -->
      <header class="mac-titlebar">
        <div class="mac-traffic-lights" aria-label="Window controls">
          <button class="traffic-light red" id="tl-close" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 12 12"><path d="m3.5 3.5 5 5m0-5-5 5"/></svg>
          </button>
          <button class="traffic-light yellow" id="tl-minimize" type="button" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 12 12"><path d="M2.5 6h7"/></svg>
          </button>
          <button class="traffic-light green" id="tl-zoom" type="button" aria-label="Zoom" title="Zoom">
            <svg viewBox="0 0 12 12"><path d="M3.5 8.5 8.5 3.5M5 3.5h3.5V7M7 8.5H3.5V5"/></svg>
          </button>
        </div>

        <div class="mac-titlebar-title">
          <div class="app-icon-squircle" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/>
            </svg>
          </div>
          <span class="window-title-text">Assistant</span>
          <span id="session-badge" class="session-badge unauth">
            <span class="status-dot"></span>
            <span id="session-label">Guest</span>
          </span>
        </div>

        <div class="mac-titlebar-actions">
          <button id="end-session" class="mac-btn-subtle" type="button" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sign Out</span>
          </button>
        </div>
      </header>

      <!-- Main Window Content Area -->
      <div class="mac-window-body">

        <!-- MAC LOGIN / ENTER USERNAME MODAL (FORMAT 2 ENTRY) -->
        <div id="mac-auth-sheet" class="mac-sheet" style="display: none;">
          <div class="mac-sheet-backdrop"></div>
          <div class="mac-auth-dialog" id="mac-auth-card">
            
            <div class="mac-avatar-wrap">
              <div class="mac-avatar-ring">
                <div class="mac-avatar-circle" id="mac-avatar-preview">
                  <svg id="mac-avatar-default" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C9.24 2 7 4.24 7 7c0 2.45 1.76 4.49 4.09 4.91C6.72 12.39 3 15.76 3 20c0 .55.45 1 1 1h16c.55 0 1-.45 1-1 0-4.24-3.72-7.61-8.09-8.09C15.24 11.49 17 9.45 17 7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 9c3.87 0 7 2.48 7 6H5c0-3.52 3.13-6 7-6z"/>
                  </svg>
                  <span id="mac-avatar-initial" class="mac-avatar-initial" style="display:none;"></span>
                </div>
              </div>
            </div>

            <div class="mac-auth-copy">
              <h2 id="mac-auth-title">Welcome</h2>
              <p id="mac-auth-desc">Enter your username to begin an AI session</p>
            </div>

            <form id="mac-login-form" class="mac-login-form" novalidate>
              <div class="mac-input-pill" id="mac-input-pill">
                <span class="mac-input-glyph" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input
                  id="mac-username-input"
                  type="text"
                  placeholder="Username"
                  autocomplete="username"
                  autocapitalize="none"
                  spellcheck="false"
                  maxlength="80"
                  required
                />
                <button id="mac-login-btn" type="submit" class="mac-arrow-btn" aria-label="Enter username" disabled>
                  <!-- Normal Arrow -->
                  <svg id="mac-btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                  <!-- macOS Radial Spinner -->
                  <div id="mac-btn-spinner" class="mac-spinner" style="display: none;">
                    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                  </div>
                </button>
              </div>

              <div id="mac-login-error" class="mac-login-error" role="alert" style="display: none;"></div>
            </form>

            <div class="mac-auth-footer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="lock-icon">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <span>A secure session token will be generated automatically.</span>
            </div>

          </div>
        </div>

        <!-- CHAT VIEW SECTION -->
        <section id="chat-view" class="chat-view" style="display: none;">
          <div id="conversation" class="conversation" aria-live="polite">
            <div id="welcome" class="welcome">
              <div class="welcome-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/>
                </svg>
              </div>
              <h1 id="welcome-heading">How can I help today?</h1>
              <p id="welcome-sub">Ask a question, brainstorm ideas, or generate content.</p>
              
              <div class="suggestion-chips" id="suggestion-chips">
                <button type="button" class="chip" data-prompt="Draft a polite follow-up email regarding our project update.">
                  <span class="chip-icon">✉️</span> Follow-up email
                </button>
                <button type="button" class="chip" data-prompt="Explain quantum computing in simple terms with an analogy.">
                  <span class="chip-icon">💡</span> Explain quantum computing
                </button>
                <button type="button" class="chip" data-prompt="Review this code snippet and suggest optimizations.">
                  <span class="chip-icon">💻</span> Optimize code
                </button>
                <button type="button" class="chip" data-prompt="Brainstorm five creative marketing ideas for a new app launch.">
                  <span class="chip-icon">🚀</span> Brainstorm ideas
                </button>
              </div>
            </div>
          </div>

          <div class="composer-container">
            <form id="composer" class="composer">
              <textarea id="message" rows="1" maxlength="8000" placeholder="Message the assistant…" aria-label="Message" required></textarea>
              <button id="send" type="submit" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"/>
                  <polyline points="5 12 12 5 19 12"/>
                </svg>
              </button>
            </form>
            <p class="disclaimer">AI responses can be inaccurate. Verify important information.</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="/api/v1/ai/assets/script.js" defer></script>
</body>
</html>
